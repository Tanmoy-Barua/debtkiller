name: App Health

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

jobs:
  health:
    name: Health check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app health check
        run: npm run health
