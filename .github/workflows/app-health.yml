name: App Health

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  health:
    name: Health check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app health
        run: npm run health
