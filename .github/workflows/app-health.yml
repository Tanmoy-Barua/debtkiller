name: App health

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

jobs:
  health:
    name: Run app health checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run health checks
        run: npm run health
