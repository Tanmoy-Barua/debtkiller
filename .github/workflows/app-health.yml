name: App Health

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

jobs:
  health:
    name: Run app health checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app health checks
        run: npm run health
